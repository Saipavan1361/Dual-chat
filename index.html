<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Viewers + Dual Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f4f6;--panel:#fff;--text:#16161a;--muted:#6b6b76;--line:#d9d9e0;--accent:#2a8a2a;--yt:#d62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--panel:#18181b;--text:#efeff1;--muted:#9a9aa5;--line:#2c2c33}}
:root[data-theme="dark"]{--bg:#0e0e10;--panel:#18181b;--text:#efeff1;--muted:#9a9aa5;--line:#2c2c33}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
header.hidden{display:none}
.f{display:flex;align-items:center;gap:6px;flex:1 1 240px}
.f span{font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.k{background:var(--accent)}.y{background:var(--yt)}.a{background:#555}
input{flex:1;min-width:0;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
button{padding:10px 14px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer}
button.go,button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.seg{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
#stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-bottom:1px solid var(--line)}
.st{padding:8px 6px;text-align:center;border-right:1px solid var(--line)}
.st:last-child{border-right:0}
.st b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.st small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.st.k b{color:var(--accent);background:none}.st.y b{color:var(--yt)}
.st.k,.st.y{background:none}
main{flex:1;min-height:0;display:grid;gap:2px;background:var(--line);grid-template-columns:1fr 1fr;grid-template-rows:1fr;grid-template-areas:"ck cy"}
main.vid{grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"v ck" "v cy"}
@media (orientation:portrait){
  main.vid{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,.9fr) 1.3fr;grid-template-areas:"v v" "ck cy"}
}
#pv{grid-area:v;display:none}main.vid #pv{display:flex}
#pk{grid-area:ck}#py{grid-area:cy}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.pane iframe{flex:1;width:100%;border:0;background:#000}
.pane iframe.chat{background:var(--panel)}
.ph{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:16px}
#fab{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));opacity:.85;z-index:5;border-radius:999px}
</style>
</head>
<body>
<header id="bar">
  <div class="f"><span class="k">KICK</span><input id="kick" placeholder="Kick channel link or name" autocapitalize="off" autocorrect="off"></div>
  <div class="f"><span class="y">YOUTUBE</span><input id="yt" placeholder="Channel link (@name) or live video link" autocapitalize="off" autocorrect="off"></div>
  <div class="f"><span class="a">API KEY</span><input id="key" type="password" placeholder="YouTube Data API key (for viewer count)" autocapitalize="off" autocorrect="off"></div>
  <button class="go" id="load">Load</button>
  <div class="seg">Watch:
    <button id="wk">Kick</button><button id="wy">YouTube</button><button id="wo">Off</button>
  </div>
</header>
<div id="stats">
  <div class="st k"><b id="vk">–</b><small id="nk">Kick viewers</small></div>
  <div class="st y"><b id="vy">–</b><small id="ny">YouTube viewers</small></div>
  <div class="st"><b id="vt">–</b><small>Total watching</small></div>
</div>
<main id="main">
  <div class="pane" id="pv"><div class="ph">Load a stream to watch it here.</div></div>
  <div class="pane" id="pk"><div class="ph">Kick chat</div></div>
  <div class="pane" id="py"><div class="ph">YouTube chat</div></div>
</main>
<button id="fab">Hide bar</button>
<script>
var $=function(i){return document.getElementById(i)};
var watch="off",pollT=null,ytVid="",chatVid="";
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function fmt(n){return n==null?"–":Number(n).toLocaleString()}
function kickName(s){
  s=s.trim().replace(/^https?:\/\/(www\.)?kick\.com\//i,"").split(/[/?#]/)[0];
  return s.replace(/[^\w-]/g,"");
}
function parseYt(s){
  s=s.trim(); if(!s)return null;
  var m=s.match(/[?&]v=([\w-]{11})/)||s.match(/youtu\.be\/([\w-]{11})/)||s.match(/\/(?:live|embed|shorts)\/([\w-]{11})/);
  if(m)return {video:m[1]};
  m=s.match(/@([\w.\-]+)/); if(m)return {handle:m[1]};
  m=s.match(/\/channel\/(UC[\w-]{22})/); if(m)return {id:m[1]};
  m=s.match(/\/user\/([\w.\-]+)/); if(m)return {user:m[1]};
  m=s.match(/\/c\/([\w.\-]+)/); if(m)return {handle:m[1]};
  if(/^UC[\w-]{22}$/.test(s))return {id:s};
  if(/^[\w-]{11}$/.test(s))return {video:s};
  return null;
}
function api(path,key){
  return fetch("https://www.googleapis.com/youtube/v3/"+path+"&key="+encodeURIComponent(key))
    .then(function(r){return r.json()})
    .then(function(j){if(j.error)throw new Error(j.error.message);return j});
}
function findLive(ref,key){
  var q=ref.handle?"forHandle="+encodeURIComponent("@"+ref.handle):ref.id?"id="+ref.id:"forUsername="+encodeURIComponent(ref.user);
  return api("channels?part=contentDetails&"+q,key).then(function(j){
    if(!j.items||!j.items.length)throw new Error("Channel not found");
    return api("playlistItems?part=contentDetails&maxResults=10&playlistId="+j.items[0].contentDetails.relatedPlaylists.uploads,key);
  }).then(function(j){
    var ids=(j.items||[]).map(function(i){return i.contentDetails.videoId}).join(",");
    return ids?api("videos?part=snippet&id="+ids,key):null;
  }).then(function(j){
    if(!j)return "";
    for(var i=0;i<j.items.length;i++)if(j.items[i].snippet.liveBroadcastContent==="live")return j.items[i].id;
    return "";
  });
}
function frame(pane,src,label,cls){
  pane.innerHTML="";
  var f=document.createElement("iframe");
  f.src=src;f.title=label;if(cls)f.className=cls;
  f.allow="autoplay; fullscreen; picture-in-picture; clipboard-write";
  f.setAttribute("allowfullscreen","");
  pane.appendChild(f);
}
function msg(pane,t){pane.innerHTML='<div class="ph">'+t+'</div>'}
function ytChat(id){
  if(chatVid===id)return; chatVid=id;
  var dark=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"&dark_theme=1":"";
  frame($("py"),"https://www.youtube.com/live_chat?v="+id+"&embed_domain="+encodeURIComponent(location.hostname||"localhost")+dark,"YouTube chat","chat");
  if(watch==="youtube")setWatch("youtube");
}
function pollKick(){
  var k=kickName($("kick").value);
  if(!k){$("vk").textContent="–";$("nk").textContent="Kick viewers";return Promise.resolve(null)}
  return fetch("https://kick.com/api/v2/channels/"+k).then(function(r){return r.json()}).then(function(j){
    if(j&&j.livestream){$("vk").textContent=fmt(j.livestream.viewer_count);$("nk").textContent="Kick viewers (live)";return j.livestream.viewer_count}
    $("vk").textContent="0";$("nk").textContent="Kick offline";return 0;
  }).catch(function(){
    $("vk").textContent="–";$("nk").textContent="Kick count blocked";return null;
  });
}
function pollYt(){
  var ref=parseYt($("yt").value),key=$("key").value.trim();
  if(!ref){$("vy").textContent="–";$("ny").textContent="YouTube viewers";return Promise.resolve(null)}
  if(!key){$("vy").textContent="–";$("ny").textContent="Add API key";return Promise.resolve(null)}
  var getVid=ref.video?Promise.resolve(ref.video):(ytVid?Promise.resolve(ytVid):findLive(ref,key));
  return getVid.then(function(vid){
    if(!vid){ytVid="";$("vy").textContent="0";$("ny").textContent="YouTube not live";return 0}
    ytVid=vid;ytChat(vid);
    return api("videos?part=liveStreamingDetails&id="+vid,key).then(function(j){
      var d=j.items&&j.items[0]&&j.items[0].liveStreamingDetails;
      if(d&&d.concurrentViewers!=null){
        var n=parseInt(d.concurrentViewers,10);
        $("vy").textContent=fmt(n);$("ny").textContent="YouTube viewers (live)";return n;
      }
      if(!ref.video)ytVid="";
      $("vy").textContent="0";$("ny").textContent="YouTube not live / hidden";return 0;
    });
  }).catch(function(e){
    $("vy").textContent="–";$("ny").textContent="YouTube: "+e.message;return null;
  });
}
function poll(){
  clearTimeout(pollT);
  Promise.all([pollKick(),pollYt()]).then(function(r){
    var t=null;
    r.forEach(function(n){if(n!=null)t=(t||0)+n});
    $("vt").textContent=fmt(t);
    pollT=setTimeout(poll,30000);
  });
}
function load(){
  save("dc_kick",$("kick").value);save("dc_yt",$("yt").value);save("dc_key",$("key").value);
  ytVid="";chatVid="";
  var k=kickName($("kick").value);
  if(k)frame($("pk"),"https://kick.com/popout/"+k+"/chat","Kick chat","chat");
  var ref=parseYt($("yt").value);
  if(ref&&ref.video)ytChat(ref.video);
  setWatch(watch);poll();
}
function setWatch(w){
  watch=w;save("dc_watch",w);
  $("wk").className=w==="kick"?"on":"";
  $("wy").className=w==="youtube"?"on":"";
  $("wo").className=w==="off"?"on":"";
  $("main").className=w==="off"?"":"vid";
  var k=kickName($("kick").value),ref=parseYt($("yt").value),y=ref&&ref.video?ref.video:chatVid;
  if(w==="kick"){
    if(k)frame($("pv"),"https://player.kick.com/"+k+"?autoplay=true","Kick player");
    else msg($("pv"),"Enter a Kick channel to watch it.");
  }else if(w==="youtube"){
    if(y)frame($("pv"),"https://www.youtube.com/embed/"+y+"?autoplay=1&rel=0&playsinline=1","YouTube player");
    else msg($("pv"),"Waiting for a YouTube live stream…");
  }else{$("pv").innerHTML=""}
}
$("load").onclick=load;
$("wk").onclick=function(){setWatch("kick")};
$("wy").onclick=function(){setWatch("youtube")};
$("wo").onclick=function(){setWatch("off")};
$("fab").onclick=function(){var b=$("bar");b.classList.toggle("hidden");$("fab").textContent=b.classList.contains("hidden")?"Show bar":"Hide bar"};
["kick","yt","key"].forEach(function(i){$(i).addEventListener("keydown",function(e){if(e.key==="Enter")load()})});
$("kick").value=get("dc_kick");$("yt").value=get("dc_yt");$("key").value=get("dc_key");
watch=get("dc_watch")||"off";
if($("kick").value||$("yt").value)load();else setWatch(watch);
</script>
</body>
</html>
